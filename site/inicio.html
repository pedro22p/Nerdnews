<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="keywords" content="Nerdnews, noticias, tecnologia">
<title>Nerdnews</title>

<style>

body {
font-family: 'Segoe UI', Arial, sans-serif;
background-color: #0047AB;
color: white;
margin: 0;
padding: 40px;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
}

h1 {
font-size: 3rem;
margin-bottom: 10px;
text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

h2 {
font-weight: 300;
font-size: 1.2rem;
color: #e0e0e0;
}

button {
background-color: #ffcc00;
border: none;
padding: 10px 20px;
margin: 10px;
border-radius: 5px;
cursor: pointer;
font-weight: bold;
text-transform: uppercase;
transition: 0.3s;
}

button:hover {
background-color: #e6b800;
transform: scale(1.05);
}

a {
text-decoration: none;
}

/* perfil */

#perfilTopo{
position:absolute;
top:20px;
right:20px;
display:flex;
align-items:center;
gap:10px;
}

#perfilTopo img{
width:50px;
height:50px;
border-radius:50%;
border:2px solid white;
}

#perfilTopo button{
background:red;
color:white;
padding:5px 10px;
}

</style>

</head>

<body>

<div id="perfilTopo">

<img id="fotoPerfil">

<span id="nomeUsuario"></span>

<button onclick="logout()">Sair</button>

</div>

<a href="Noticias.html">
<button type="button">Noticias</button>
</a>

<a href="ferramentas.html">
<button type="button">ferramentas</button>
</a>

<h2>feito por NewsStudios</h2>

<a href="https://www.instagram.com/pedro1348p/" target="_blank">
<button type="button">fale connosco</button>
</a>

<script>

let conta = JSON.parse(localStorage.getItem("conta"));

if(conta){

document.getElementById("nomeUsuario").innerText = conta.usuario;

if(conta.foto){
document.getElementById("fotoPerfil").src = conta.foto;
}

}

function logout(){

localStorage.removeItem("logado");

window.location.href = "login.html";

}

</script>

</body>
</html>
